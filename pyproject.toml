[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blisolver"
version = "0.1.0"
description = "Ingestion front-door: a bilibili URL -> a timeline-aligned transcript + per-frame visual-notes bundle for a downstream knowledge base (Atlas)."
requires-python = ">=3.11"
readme = "README.md"

# Spine deps (build steps 1-2). Heavier stage deps live in optional groups below and are
# installed when their stage lands, so the spine stays cheap to set up. Versions pinned at install.
dependencies = [
    "yt-dlp>=2026.6.9",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# NOTE: there is no `transcribe` extra. Local ASR runs whisper.cpp through the external
# `whisper-cli` binary plus a GGML model file, neither of which is a Python package — see
# blisolver/transcribe.py and `blisolver doctor`, which checks the binary and the weights
# separately. A `transcribe` extra used to pull faster-whisper and NVIDIA CUDA wheels; nothing has
# imported faster_whisper since the whisper.cpp shim landed, so installing it downloaded hundreds
# of megabytes to satisfy no import.
# step 4: frame extraction + perceptual dedup
frames = ["Pillow>=12", "imagehash>=4.3.2"]
# step 5: vision captioning
vision = ["openai>=2.44"]
# Phase E: MCP interface layer (Agent-callable server)
# MCPServer is the stable SDK 2.x API. Keep the next-major upper bound so a future incompatible
# SDK release cannot silently break a fresh plugin install.
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8", "jsonschema>=4.20", "ruff>=0.6"]

[project.scripts]
blisolver = "blisolver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["blisolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the network against a real public video (opt in with -m live)"]

[tool.ruff]
line-length = 99
